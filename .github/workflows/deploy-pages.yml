name: Deploy Garaj.Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/Garaj.Web/**"
      - "src/Garaj.Core/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Garaj.Web
        run: dotnet publish src/Garaj.Web/Garaj.Web.csproj -c Release -o publish

      - name: Rewrite base href for the GitHub Pages subpath
        run: |
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' publish/wwwroot/index.html
          grep '<base href=' publish/wwwroot/index.html

      - name: Disable Jekyll processing
        run: touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
